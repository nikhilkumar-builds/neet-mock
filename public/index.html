<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEET Mock Tests</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="login panel">
  <h1>NEET Mock Tests</h1>
  <p class="muted">Sign in to continue.</p>
  <label for="role">I am the</label>
  <select id="role"><option value="student">Student</option><option value="admin">Teacher</option></select>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <p class="err" id="err" role="alert"></p>
  <button class="primary" id="go">Sign in</button>
</main>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
